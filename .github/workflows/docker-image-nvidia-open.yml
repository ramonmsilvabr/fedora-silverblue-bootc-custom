name: nvidia-open build

on:
  schedule:
    - cron: '0 6 * * 1' # Constrói as 6:00 da segunda
  workflow_dispatch:
    inputs:
      fedora_version:
        description: 'Versão do Fedora Silverblue'
        default: '44'
        required: false

env:
  IMAGE_NAME: fedora-silverblue-bootc-custom-nvidia-open
  REGISTRY: ghcr.io/${{ github.repository_owner }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    env:
      SELECTED_VERSION: ${{ github.event.inputs.fedora_version || '44' }}
      DEFAULT_VERSION: '44'
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
    
      - name: Checkout Repo
        uses: actions/checkout@v4
        
      - name: Gerar metadados do build
        id: meta
        run: |
          VERSION=${{ env.SELECTED_VERSION }}
          DATE=$(TZ='America/Sao_Paulo' date +'%Y%m%d-%H%M')
          VERSIONANDDATE="${VERSION}-${DATE}"
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ env.SELECTED_VERSION }}" -gt "${{ env.DEFAULT_VERSION }}" ]; then
            echo "channel=beta" >> $GITHUB_OUTPUT
          elif [ "${{ env.SELECTED_VERSION }}" -eq "${{ env.DEFAULT_VERSION }}" ]; then
            echo "channel=latest" >> $GITHUB_OUTPUT
          else
            echo "channel=old" >> $GITHUB_OUTPUT
          fi
          echo "version=${VERSION}"     >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "versionanddate=${VERSIONANDDATE}"     >> $GITHUB_OUTPUT
          
      - name: Log into GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Assinatura  dos módulos  de kernel
        env:
          PRIVATEKEY_BASE64: ${{ secrets.SECURE_BOOT_KEY }}
        run: |
            mkdir -p .anchor
            echo -n "$PRIVATEKEY_BASE64" | base64 --decode > .anchor/MOK.priv
            
      - name: Build da imagem inicial (como root)
        run: |
          sudo podman build \
            --skip-unused-stages=false \
            --security-opt label=disable \
            -t "localhost/bootc-raw:latest" \
            -f ./nvidia-open/Containerfile \
            -v "$(pwd):/run/src" \
            --build-arg FEDORA_VERSION=${{ env.SELECTED_VERSION }} \
            .

      - name: Rechunk via bootc-base-imagectl 
        run: |
          sudo podman run --rm --privileged \
            -v /var/lib/containers:/var/lib/containers \
            quay.io/fedora/fedora-bootc:44 \
            /usr/libexec/bootc-base-imagectl rechunk \
            localhost/bootc-raw:latest \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SELECTED_VERSION }}

      - name: Push da tag principal otimizada
        run: sudo podman push "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.SELECTED_VERSION }}"

      - name: Aplicar demais tags e push
        run: |
          REGISTRY_IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          SOURCE="${REGISTRY_IMAGE}:${{ env.SELECTED_VERSION }}"

          for TAG in "${{ steps.meta.outputs.versionanddate }}" \
               "${{ steps.meta.outputs.short_sha }}" \
               "${{ steps.meta.outputs.channel }}"; do
            sudo podman tag "$SOURCE" "${REGISTRY_IMAGE}:${TAG}"
            sudo podman push "${REGISTRY_IMAGE}:${TAG}"
          done
